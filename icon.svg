<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c120c"/>
      <stop offset="50%" stop-color="#2a180e"/>
      <stop offset="100%" stop-color="#140b07"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c341b"/>
      <stop offset="50%" stop-color="#7a4726"/>
      <stop offset="100%" stop-color="#4a2814"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Khim Body (Trapezoid) -->
  <polygon points="120,120 392,120 440,390 72,390" fill="url(#woodGrad)" stroke="#3e2010" stroke-width="8" filter="url(#glow)"/>
  <polygon points="128,128 384,128 430,382 82,382" fill="none" stroke="#241308" stroke-width="4"/>

  <!-- Left Bridge (หย่องซ้าย) -->
  <polygon points="185,135 205,135 220,375 200,375" fill="#3a1e0f" stroke="#eab308" stroke-width="2"/>
  <!-- Right Bridge (หย่องขวา) -->
  <polygon points="307,135 327,135 312,375 292,375" fill="#3a1e0f" stroke="#eab308" stroke-width="2"/>

  <!-- Sound Holes (รูระบายเสียงลายไทย) -->
  <circle cx="150" cy="256" r="28" fill="#140b07" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="150" cy="256" r="16" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="362" cy="256" r="28" fill="#140b07" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="362" cy="256" r="16" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Strings running across -->
  <line x1="90" y1="160" x2="422" y2="160" stroke="#fef08a" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="86" y1="192" x2="426" y2="192" stroke="#fde047" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="82" y1="224" x2="430" y2="224" stroke="#eab308" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="78" y1="256" x2="434" y2="256" stroke="#ca8a04" stroke-width="3" stroke-opacity="0.9"/>
  <line x1="75" y1="288" x2="437" y2="288" stroke="#ca8a04" stroke-width="3" stroke-opacity="0.9"/>
  <line x1="73" y1="320" x2="439" y2="320" stroke="#a16207" stroke-width="3.5" stroke-opacity="0.9"/>
  <line x1="71" y1="352" x2="441" y2="352" stroke="#854d0e" stroke-width="3.5" stroke-opacity="0.9"/>

  <!-- Thai Khim hammers / emblem -->
  <path d="M256,190 L256,330" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="180" r="14" fill="url(#goldGrad)"/>
  <circle cx="256" cy="340" r="10" fill="url(#goldGrad)"/>

  <!-- Text -->
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="4">ขิมไทย PRO</text>
</svg>
